# Local development stack. Production lives in deploy/docker-compose.yml.
#
# Every Python service is the same image (see Dockerfile) and differs only in
# `command`. Compose builds it once — the services share one `image:` tag — so
# adding a domain costs a five-line block, not another Dockerfile.
#
# REDIS_URL / DATABASE_URL / DATABASE_URL_SYNC come from .env (see .env.example),
# where they already point at the `redis` and `postgres` service names.

x-mft: &mft
  build:
    context: .
    dockerfile: Dockerfile
  image: mft:dev
  env_file:
    - .env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mft}
      POSTGRES_DB: ${POSTGRES_DB:-mft}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mft} -d ${POSTGRES_DB:-mft}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *mft
    command: ["mft-db-migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *mft
    command: ["python", "scripts/seed_paper_apis.py"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    <<: *mft
    command: ["mft-api"]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  md:
    <<: *mft
    command: ["md"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      paper:
        condition: service_started

  paper:
    <<: *mft
    command: ["paper"]
    depends_on:
      redis:
        condition: service_healthy

  td:
    <<: *mft
    command: ["td"]
    depends_on:
      redis:
        condition: service_healthy
      paper:
        condition: service_started

  sts:
    <<: *mft
    command: ["sts"]
    depends_on:
      redis:
        condition: service_healthy

  # Symbol plane. Lifecycle is independent of td/md/sts — it is up whenever
  # the stack is, so an instrument can be resolved before anything trades.
  sym:
    <<: *mft
    command: ["sym"]
    environment:
      # Listings are near-static; an hourly re-pull is plenty.
      SYM_REFRESH_INTERVAL: "3600"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      # Browser → host-published API (WebSocket logs)
      PUBLIC_API_URL: http://localhost:8000
      # Vite proxy inside the frontend container → api service
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:

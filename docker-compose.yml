# Local development stack. The production stack is kept outside this repo.
#
# Every Python service is the same image (see Dockerfile) and differs only in
# `command`. Compose builds it once — the services share one `image:` tag — so
# adding a domain costs a five-line block, not another Dockerfile.
#
# REDIS_URL / DATABASE_URL / DATABASE_URL_SYNC come from .env (see .env.example),
# where they already point at the `redis` and `postgres` service names.

x-mftik: &mftik
  build:
    context: .
    dockerfile: Dockerfile
  image: mftik:dev
  env_file:
    - .env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mftik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mftik}
      POSTGRES_DB: ${POSTGRES_DB:-mftik}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mftik} -d ${POSTGRES_DB:-mftik}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *mftik
    command: ["mftik-db-migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *mftik
    command: ["python", "scripts/seed_paper_apis.py"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    <<: *mftik
    command: ["mftik-api"]
    ports:
      - "8000:8000"
    environment:
      MFTIK_DATA: /var/lib/mftik
      # On. This stack is where in-app auth is developed and verified;
      # production keeps its Traefik chain and this flag off until the cutover,
      # because running both gates locks everybody out. See docs/Auth.md.
      #
      # First `just up` on an empty database: open the UI and claim the
      # instance at /login. `seed` has already created the Owner row so
      # foreign keys resolve; claiming fills in its username and password.
      MFTIK_AUTH_ENABLED: "1"
      # This stack is http end to end, and Safari drops Secure cookies there.
      MFTIK_COOKIE_SECURE: "0"
    volumes:
      - mftik_data:/var/lib/mftik
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  md:
    <<: *mftik
    command: ["md"]
    environment:
      # Recorded tape, so a strategy that starts later can warm up on prints
      # it was not running for. Only the trade feeds — a book snapshot is ~7x
      # the bytes and no use as history.
      #
      # One topic, not both. aggtrade and trade describe the same matches, so
      # recording both doubles the memory to serve a strategy that can only
      # read one of them (MacdDollarBars refuses a session subscribed to both).
      MD_TAPE_TOPICS: "aggtrade"
      # How far back a warm-up may reach. Retention is a duration, not a count:
      # the same number of prints is eight hours of a quiet instrument and
      # twenty minutes of a busy one.
      MD_TAPE_RETENTION_S: "7200"
      # Memory fuse per feed, in records — roughly 200 bytes each, so ~30 MB.
      #
      # Sized against the Redis this deploys to, not against the retention
      # window: that box caps Redis at 512mb with maxmemory-policy noeviction,
      # and Redis here is the whole broker — order RPC, ledger and oms state,
      # liveness. A tape that fills the cap does not degrade the warm-up, it
      # stops the writes that trade. The budget is this number times the number
      # of recorded feeds, and it has to stay well under 512mb with room for
      # everything else: 150k x 8 feeds is ~240mb, which does.
      #
      # 2h of a busy perp (~50 msg/s) is ~360k records, so this fuse will bite
      # first on the busiest instruments — they will warm up on less than two
      # hours, and the coverage stamps will say so rather than pretending.
      # Raising it needs a bigger box or a smaller feed list, not just a bigger
      # number.
      MD_TAPE_MAXLEN: "150000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      paper:
        condition: service_started

  paper:
    <<: *mftik
    command: ["paper"]
    depends_on:
      redis:
        condition: service_healthy

  td:
    <<: *mftik
    command: ["td"]
    depends_on:
      redis:
        condition: service_healthy
      paper:
        condition: service_started

  sts:
    <<: *mftik
    command: ["sts"]
    volumes:
      - sts_eventlog:/var/log/mftik/sts
      - mftik_data:/var/lib/mftik
    environment:
      MFTIK_DATA: /var/lib/mftik
      # Restart the stack and interrupted sessions come back on their own.
      STS_REBUILD_ON_BOOT: "1"
      # One jsonl per session: every event it was handed and every call it
      # made. A named volume, not the container filesystem — the moment the
      # log is worth reading is usually the moment the container went away.
      STS_EVENTLOG_DIR: "/var/log/mftik/sts"
      # Records held between the session and the disk. Overflow is dropped and
      # counted into the file rather than blocking the dispatch path — a full
      # queue must not put disk latency in front of an order.
      STS_EVENTLOG_QUEUE: "20000"
      # Disk per session is MAX_BYTES x (BACKUPS + 1) — 768 MB here. Sized for
      # a session that records the book feeds: at ~1.5 KB a snapshot, an
      # orderbook subscription writes on the order of 250 MB an hour, so this
      # is hours rather than days. Sessions reading only trade feeds are an
      # order of magnitude cheaper and will never reach it.
      STS_EVENTLOG_MAX_BYTES: "268435456"
      STS_EVENTLOG_BACKUPS: "2"
    depends_on:
      redis:
        condition: service_healthy

  # Symbol plane. Lifecycle is independent of td/md/sts — it is up whenever
  # the stack is, so an instrument can be resolved before anything trades.
  sym:
    <<: *mftik
    command: ["sym"]
    environment:
      # Listings are near-static; an hourly re-pull is plenty.
      SYM_REFRESH_INTERVAL: "3600"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      # Vite proxy inside the frontend container → api service, for /api and
      # now /ws alike. WebSockets are opened on this origin rather than the
      # API's own, so the session cookie rides the handshake; see src/lib/ws.ts.
      API_PROXY_TARGET: http://api:8000
      # Same origin as the proxy target. +layout.server.ts asks /auth/status
      # here because a relative /api fetch would hit this container, not api.
      API_INTERNAL_URL: http://api:8000
      # Production gets sha-<commit> from MFTIK_VERSION; locally it is just "dev".
      PUBLIC_APP_VERSION: ${MFTIK_VERSION:-dev}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  sts_eventlog:
  mftik_data:

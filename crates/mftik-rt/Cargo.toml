[package]
name = "mftik-rt"
description = "Session worker runtime: fd 3, C4, the dispatcher, NATS, and timers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
async-nats = { version = "0.50.0", default-features = false, features = ["nkeys", "ring"] }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
libc = "0.2.191"
mftik-core = { path = "../mftik-core" }
mftik-proto = { path = "../mftik-proto" }
nkeys = "0.4.5"
prost = "0.14.4"
signal-hook = "0.4.5"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
mftik-testkit = { path = "../mftik-testkit" }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "test-util"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

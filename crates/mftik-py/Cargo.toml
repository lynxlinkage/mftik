[package]
name = "mftik-py"
description = "PyO3 bindings. The Python import name is mftik."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "_mftik"
crate-type = ["cdylib", "rlib"]

[dependencies]
mftik-core = { path = "../mftik-core" }
mftik-proto = { path = "../mftik-proto" }
mftik-rt = { path = "../mftik-rt" }
prost = "0.14.4"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[build-dependencies]
heck = "0.5"
prost = "0.14.4"
prost-types = "0.14.4"
protoc-bin-vendored = "3.3.0"

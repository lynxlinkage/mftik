[package]
name = "mftik-py"
description = "PyO3 bindings. The Python import name is mftik; the native module is mftik._mftik."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "mftik"
crate-type = ["cdylib", "rlib"]

[dependencies]
mftik-core = { path = "../mftik-core" }
mftik-proto = { path = "../mftik-proto" }
mftik-rt = { path = "../mftik-rt" }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[build-dependencies]
heck = "0.5"
prost = "0.14.4"
prost-types = "0.14.4"
protoc-bin-vendored = "3.3.0"

[dev-dependencies]
async-nats = { version = "0.50.0", default-features = false, features = ["nkeys", "ring"] }
futures-util = { version = "0.3.34", default-features = false }
mftik-testkit = { path = "../mftik-testkit" }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time"] }

[package]
name = "mftik-py"
description = "PyO3 bindings. The Python import name is mftik; the native module is mftik._mftik."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "mftik"
crate-type = ["cdylib", "rlib"]

[dependencies]
mftik-core = { path = "../mftik-core" }
mftik-rt = { path = "../mftik-rt" }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[dev-dependencies]
mftik-proto = { path = "../mftik-proto" }
mftik-testkit = { path = "../mftik-testkit" }

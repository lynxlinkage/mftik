# Production API layer for mftik.lynkora.com. Lives at /opt/mftik/deploy.
#
# Planes (td/md/sts/sym/paper and their instances) run as s7n OCI assignments,
# not here. This file is only api + frontend + one-shot migrate/seed.
#
# Nothing here publishes a port. Traefik (/opt/traefik, compose project
# `traefik`) owns :80/:443 and discovers containers on the external `web`
# network. Postgres is long-lived substrate on 172.238.24.139. NATS is the
# s7n supercluster on this host's Tailscale address.
#
# Routing on the single host mftik.lynkora.com, by priority:
#   /api/*  -> api:8000    (StripPrefix /api — the routers have no prefix)
#   /ws/*   -> api:8000    (no strip — WebSocket paths are literal)
#   /*      -> frontend:3000

name: mftik

x-mftik: &mftik
  image: ghcr.io/lynxlinkage/mftik:${MFTIK_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  networks: [web]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-shot: alembic upgrade head. Run with `run --rm` before `up -d`.
  migrate:
    <<: *mftik
    restart: "no"
    command: ["mftik-db-migrate"]
    profiles: ["tools"]

  # One-shot: dev user (MFTIK_DEFAULT_USER_ID=1) + the two paper API rows, plus a
  # Gate row when GATE_SPOT_API_KEY/SECRET are set. Idempotent.
  seed:
    <<: *mftik
    restart: "no"
    command: ["python", "scripts/seed_paper_apis.py"]
    profiles: ["tools"]

  api:
    <<: *mftik
    command: ["mftik-api"]
    volumes:
      - mftik_data:/var/lib/mftik
    environment:
      NATS_URL: nats://100.108.10.2:4222
      # The gate is this app's own now, and this is what turns it on. Off, every
      # request is MFTIK_DEFAULT_USER_ID — which is what it was while the Traefik
      # chain in front of it was doing the deciding.
      MFTIK_AUTH_ENABLED: "1"
      # Where the browser reaches this API, prefix included. It cannot be
      # derived: Traefik strips /api before the app sees anything, so the API's
      # own view of its URL is exactly the one an OAuth provider must not be
      # given. Register the callback under this base on the Discord/Google
      # application; the client id and secret go in .env, not here.
      MFTIK_OAUTH_REDIRECT_BASE: "https://mftik.lynkora.com/api"
      # The strategy registry: public/, private/, pulled/ and remotes.toml.
      # Named volume so a replace of this container does not take the trees.
      MFTIK_DATA: /var/lib/mftik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.services.mftik-api.loadbalancer.server.port=8000"
      # Strip /api: the FastAPI routers are mounted at the root, and the
      # frontend calls /api/... because that is what the Vite dev proxy did.
      - "traefik.http.middlewares.mftik-strip-api.stripprefix.prefixes=/api"
      # The trailing slash is load-bearing. PathPrefix is a plain string
      # prefix, so `/api` also matched `/apis` - a UI page - and the browser
      # got a raw JSON 401 from FastAPI instead of a document (issue #19).
      # Nothing asks for a bare `/api`: every browser call is `/api/...` and
      # MFTIK_OAUTH_REDIRECT_BASE is only ever used with a suffix.
      - "traefik.http.routers.mftik-api.rule=Host(`mftik.lynkora.com`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.mftik-api.entrypoints=websecure"
      - "traefik.http.routers.mftik-api.tls.certresolver=le"
      - "traefik.http.routers.mftik-api.priority=100"
      # Browser security headers (issue #21). Defined here rather than in
      # /opt/traefik because that stack is shared host infrastructure — portal,
      # autom and strategon route through the same Traefik, and none of them
      # asked for this policy. Attached to both the API and the document
      # router so a JSON response is covered too.
      #
      # CSP is deliberately NOT here. The document carries one inline
      # hydration script, so a policy written at the edge would have to allow
      # `script-src 'unsafe-inline'` — which is the thing CSP exists to stop.
      # SvelteKit emits its own CSP with that script hashed; see kit.csp in
      # frontend/svelte.config.js.
      - "traefik.http.middlewares.mftik-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.mftik-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.mftik-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.mftik-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.mftik-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.mftik-api.middlewares=mftik-strip-api,mftik-security-headers"
      # WebSockets (/ws/status/sts, /ws/sts/{id}, /ws/td/{id}, /ws/md/{venue}).
      # Separate router because these paths are NOT stripped — the browser opens
      # them directly at the origin, so they must arrive at the API verbatim.
      - "traefik.http.routers.mftik-ws.rule=Host(`mftik.lynkora.com`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.mftik-ws.entrypoints=websecure"
      - "traefik.http.routers.mftik-ws.tls.certresolver=le"
      - "traefik.http.routers.mftik-ws.priority=100"
      - "traefik.http.routers.mftik-ws.service=mftik-api"

  frontend:
    image: ghcr.io/lynxlinkage/mftik-frontend:${MFTIK_VERSION:-latest}
    restart: unless-stopped
    environment:
      ORIGIN: https://mftik.lynkora.com
      # Same pin as the image tag, surfaced in the UI's corner badge so the
      # running build is identifiable without SSHing to the host.
      PUBLIC_APP_VERSION: ${MFTIK_VERSION:-latest}
    networks: [web]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.mftik-frontend.rule=Host(`mftik.lynkora.com`)"
      - "traefik.http.routers.mftik-frontend.entrypoints=websecure"
      - "traefik.http.routers.mftik-frontend.tls.certresolver=le"
      - "traefik.http.routers.mftik-frontend.priority=1"
      - "traefik.http.routers.mftik-frontend.middlewares=mftik-security-headers"
      - "traefik.http.services.mftik-frontend.loadbalancer.server.port=3000"

volumes:
  # The strategy registry. Source trees, not caches: a session deployed from a
  # pulled strategy cannot be rebuilt without them.
  mftik_data:

networks:
  web:
    name: web
    external: true

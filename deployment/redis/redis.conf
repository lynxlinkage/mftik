# One file for every regional tape disk. Two sites, one Redis each, next to the
# MD that pumps that site's feeds (docs/JetStreamRemoval.md).
#
# This is not a broker and not a cache. It is the only copy of recorded prints:
# MD is the only process that sees every trade, and no venue will serve an
# aggtrade that was never recorded. TD can recon its book from the venue; a lost
# tape is a warm-up window nobody can rebuild.

# Loopback only. The one caller is the MD on this host, which runs with host
# networking, so 127.0.0.1 is this machine's loopback for it too. STS never
# opens Redis at all — a TW session warming up on a JP feed would otherwise
# reach for the wrong disk. Not listening on Tailscale is what enforces that.
bind 127.0.0.1
port 6379
protected-mode yes

# The durability the tape needs, and the reason this is not a plain `redis-server`
# with defaults. RDB alone loses everything since the last snapshot, which is
# exactly the window a restart must not lose. `dir ./` is the agent's strategy
# directory (the exec driver's cwd), which lives outside releases/ — so a version
# roll replaces the binary and keeps appendonlydir/.
appendonly yes
appendfsync everysec
dir ./
save ""

# Bound the store rather than the host. cp has 4 GB total and also carries
# Traefik, the API, the frontend and SeaweedFS; an unbounded tape there is an
# OOM kill of something else. The budget: MD_TAPE_MAXLEN is 150k records per
# feed at roughly 200 bytes, so eight recorded feeds are ~240 MB.
#
# noeviction, not allkeys-lru. Full means new prints are refused, which MD
# already tolerates — append must not fail the live fan-out, so a rejected write
# costs recorded history and not a tick. Eviction would instead delete whichever
# key an algorithm picked, silently shortening a warm-up window that a strategy
# has already been told the coverage of.
maxmemory 512mb
maxmemory-policy noeviction

# The agent supervises this process and captures its output. Daemonizing would
# hand it to init and make the supervisor lose track of it; a logfile would put
# the lines somewhere the deploy UI cannot read.
daemonize no
logfile ""

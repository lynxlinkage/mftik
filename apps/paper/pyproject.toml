[project]
name = "mftik-paper"
version = "0.1.0"
description = "MFTIK paper exchange engine service"
requires-python = ">=3.12"
dependencies = [
    "mftik",
    # The loop this process runs on — docs/EventLoop.md says why. Declared even
    # though the shared image already has it via `uvicorn[standard]`: that only
    # holds because `uv sync --all-packages` installs the API's dependencies
    # into the same venv, and a per-app sync would start this process on a
    # missing import.
    "uvloop>=0.21",
]

[tool.uv.sources]
mftik = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik_paper"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik_paper" = "mftik_paper"

[project.scripts]
paper = "mftik_paper:main"

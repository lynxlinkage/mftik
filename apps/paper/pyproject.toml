[project]
name = "mft-paper"
version = "0.1.0"
description = "MFT paper exchange engine service"
requires-python = ">=3.12"
dependencies = [
    "mft-common",
]

[tool.uv.sources]
mft-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_paper"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_paper" = "mft_paper"

[project.scripts]
paper = "mft_paper:main"

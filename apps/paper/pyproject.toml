[project]
name = "mftik-paper"
version = "0.1.0"
description = "MFT paper exchange engine service"
requires-python = ">=3.12"
dependencies = [
    "mftik-common",
]

[tool.uv.sources]
mftik-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik_paper"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik_paper" = "mftik_paper"

[project.scripts]
paper = "mftik_paper:main"

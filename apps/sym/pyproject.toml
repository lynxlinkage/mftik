[project]
name = "mftik-sym"
version = "0.1.0"
description = "MFTIK symbol plane — golden record of venue instruments"
requires-python = ">=3.12"
dependencies = [
    "mftik-common",
    "mftik-db",
]

[tool.uv.sources]
mftik-common = { workspace = true }
mftik-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik_sym"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik_sym" = "mftik_sym"

[project.scripts]
sym = "mftik_sym:main"

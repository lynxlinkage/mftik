[project]
name = "mft-sym"
version = "0.1.0"
description = "MFT symbol plane — golden record of venue instruments"
requires-python = ">=3.12"
dependencies = [
    "mft-common",
    "mft-db",
]

[tool.uv.sources]
mft-common = { workspace = true }
mft-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_sym"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_sym" = "mft_sym"

[project.scripts]
sym = "mft_sym:main"

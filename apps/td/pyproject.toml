[project]
name = "mftik-td"
version = "0.1.0"
description = "MFTIK trading domain"
requires-python = ">=3.12"
dependencies = [
    "mftik",
    "mftik-db",
    # The loop this process runs on — docs/EventLoop.md says why. Declared even
    # though the shared image already has it via `uvicorn[standard]`: that only
    # holds because `uv sync --all-packages` installs the API's dependencies
    # into the same venv, and a per-app sync would start this process on a
    # missing import.
    "uvloop>=0.21",
]

[tool.uv.sources]
mftik = { workspace = true }
mftik-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik_td"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik_td" = "mftik_td"

[project.scripts]
td = "mftik_td:main"

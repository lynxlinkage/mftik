[project]
name = "mft-td"
version = "0.1.0"
description = "MFT trading domain"
requires-python = ">=3.12"
dependencies = [
    "mft-common",
    "mft-db",
]

[tool.uv.sources]
mft-common = { workspace = true }
mft-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_td"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_td" = "mft_td"

[project.scripts]
td = "mft_td:main"

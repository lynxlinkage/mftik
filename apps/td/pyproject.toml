[project]
name = "mftik-td"
version = "0.1.0"
description = "MFTIK trading domain"
requires-python = ">=3.12"
dependencies = [
    "mftik-common",
    "mftik-db",
]

[tool.uv.sources]
mftik-common = { workspace = true }
mftik-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik_td"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik_td" = "mftik_td"

[project.scripts]
td = "mftik_td:main"

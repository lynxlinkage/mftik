[project]
name = "mft-api"
version = "0.1.0"
description = "MFT FastAPI gateway"
requires-python = ">=3.12"
dependencies = [
    "mft-common",
    "mft-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
]

[tool.uv.sources]
mft-common = { workspace = true }
mft-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_api"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_api" = "mft_api"

[project.scripts]
mft-api = "mft_api.main:run"

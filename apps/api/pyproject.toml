[project]
name = "mftik-api"
version = "0.1.0"
description = "MFTIK FastAPI gateway"
requires-python = ">=3.12"
dependencies = [
    "mftik",
    "mftik-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # `uvicorn[standard]` already pulls this in, and that is exactly the reason
    # to name it: `run()` now asks Uvicorn for `loop="uvloop"` outright, so the
    # API would fail to start if that extra ever stopped including it. A loop
    # this process names in code is one it should depend on in its own right.
    "uvloop>=0.21; sys_platform != 'win32'",
    "websockets>=13.0",
    # argon2id for the Owner's password. The one hashing decision here, and
    # not one to hand-roll.
    "argon2-cffi>=23.1",
    # Declared here because ALT-6 posts Discord and the matcher compile
    # (ALT-3) / search (ALT-5) use the ``regex`` package, not stdlib ``re``.
    "httpx>=0.27",
    "regex>=2024.0",
]

[tool.uv.sources]
mftik = { workspace = true }
mftik-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik_api"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik_api" = "mftik_api"

[project.scripts]
mftik-api = "mftik_api.main:run"

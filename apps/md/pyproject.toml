[project]
name = "mft-md"
version = "0.1.0"
description = "MFT market-data domain"
requires-python = ">=3.12"
dependencies = [
    "mft-common",
]

[tool.uv.sources]
mft-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_md"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_md" = "mft_md"

[project.scripts]
md = "mft_md:main"

[project]
name = "mftik-md"
version = "0.1.0"
description = "MFT market-data domain"
requires-python = ">=3.12"
dependencies = [
    "mftik-common",
    "mftik-db",
]

[tool.uv.sources]
mftik-common = { workspace = true }
mftik-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik_md"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik_md" = "mftik_md"

[project.scripts]
md = "mftik_md:main"

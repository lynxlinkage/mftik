[project]
name = "mft-sts"
version = "0.1.0"
description = "MFT strategy domain"
requires-python = ">=3.12"
dependencies = [
    "mft-common",
    "mft-db",
]

[tool.uv.sources]
mft-common = { workspace = true }
mft-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_sts"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_sts" = "mft_sts"

[project.scripts]
sts = "mft_sts:main"

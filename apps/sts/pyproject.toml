[project]
name = "mftik-sts"
version = "0.1.0"
description = "MFTIK strategy domain"
requires-python = ">=3.12"
dependencies = [
    "mftik",
    "mftik-db",
]

[tool.uv.sources]
mftik = { workspace = true }
mftik-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik_sts"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik_sts" = "mftik_sts"

[project.scripts]
sts = "mftik_sts:main"

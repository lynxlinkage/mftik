[workspace]
resolver = "3"
members = [
    "crates/mftik-proto",
    "crates/mftik-core",
    "crates/mftik-py",
    "crates/mftik-rt",
    "crates/mftik-testkit",
    "examples/conform",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
repository = "https://github.com/lynxlinkage/mftik"

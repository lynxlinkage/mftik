# Production stack. Lives wherever you keep it on the host, next to its .env.
#
# Deploys are manual: set MFTIK_VERSION in .env to a published tag, then run
# `docker compose pull && docker compose run --rm migrate && docker compose up -d`.
# CI only builds and publishes the images — it never touches a host.
#
# Nothing here publishes a port. A standalone Traefik (compose project
# `traefik`, not this stack) owns :80/:443 and discovers containers on the external `web`
# network. Postgres and Redis are long-lived substrate on another host and are
# not managed by this file.
#
# Routing on the single host $MFTIK_DOMAIN, by priority:
#   /api/*  -> api:8000    (StripPrefix /api — the routers have no prefix)
#   /ws/*   -> api:8000    (no strip — WebSocket paths are literal)
#   /*      -> frontend:3000
# The API authenticates its own requests (docs/Auth.md). It used to sit behind
# discord-auth-chain@docker, which could not hold the two machine paths this
# node needs — a peer pulling /registry/v1, or a script carrying a key — because
# it answers every non-navigation request with 401 before FastAPI sees it.
# Traefik still terminates TLS and routes; it no longer decides who gets in.

# Fixed project name so containers are mftik-api-1 etc. regardless of the
# directory CI runs compose from.
name: mftik

x-mftik: &mftik
  image: ghcr.io/lynxlinkage/mftik:${MFTIK_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  networks: [web]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-shot: alembic upgrade head. CI runs this with `run --rm` before `up -d`,
  # so it is deliberately not part of the running set.
  migrate:
    <<: *mftik
    restart: "no"
    command: ["mftik-db-migrate"]
    profiles: ["tools"]

  # One-shot: dev user (MFTIK_DEFAULT_USER_ID=1) + the two paper API rows, plus a
  # Gate row when GATE_SPOT_API_KEY/SECRET are set. Idempotent.
  seed:
    <<: *mftik
    restart: "no"
    command: ["python", "scripts/seed_paper_apis.py"]
    profiles: ["tools"]

  api:
    <<: *mftik
    command: ["mftik-api"]
    volumes:
      - mftik_data:/var/lib/mftik
    environment:
      # The gate is this app's own now, and this is what turns it on. Off, every
      # request is MFTIK_DEFAULT_USER_ID — which is what it was while the Traefik
      # chain in front of it was doing the deciding.
      MFTIK_AUTH_ENABLED: "1"
      # Where the browser reaches this API, prefix included. It cannot be
      # derived: Traefik strips /api before the app sees anything, so the API's
      # own view of its URL is exactly the one an OAuth provider must not be
      # given. Register the callback under this base on the Discord/Google
      # application; the client id and secret go in .env, not here.
      MFTIK_OAUTH_REDIRECT_BASE: "https://${MFTIK_DOMAIN:?set MFTIK_DOMAIN in .env}/api"
      # The strategy registry: public/, private/, pulled/ and remotes.toml.
      #
      # Two things were wrong without this. MFTIK_DATA defaults to a relative
      # `.mftik`, so the trees lived in the container's writable layer and every
      # deploy took them with it. And sts is a *different* container, so its
      # `.mftik` was a different directory — a strategy added through the API
      # was never visible to the process that has to load it. Sharing one
      # named volume, as the local stack already does, fixes both.
      MFTIK_DATA: /var/lib/mftik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.services.mftik-api.loadbalancer.server.port=8000"
      # Strip /api: the FastAPI routers are mounted at the root, and the
      # frontend calls /api/... because that is what the Vite dev proxy did.
      - "traefik.http.middlewares.mftik-strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.mftik-api.rule=Host(`${MFTIK_DOMAIN:?set MFTIK_DOMAIN in .env}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.mftik-api.entrypoints=websecure"
      - "traefik.http.routers.mftik-api.tls.certresolver=le"
      - "traefik.http.routers.mftik-api.priority=100"
      - "traefik.http.routers.mftik-api.middlewares=mftik-strip-api"
      # WebSockets (/ws/status/sts, /ws/sts/{id}, /ws/td/{id}, /ws/md/{venue}).
      # Separate router because these paths are NOT stripped — the browser opens
      # them directly at the origin, so they must arrive at the API verbatim.
      - "traefik.http.routers.mftik-ws.rule=Host(`${MFTIK_DOMAIN:?set MFTIK_DOMAIN in .env}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.mftik-ws.entrypoints=websecure"
      - "traefik.http.routers.mftik-ws.tls.certresolver=le"
      - "traefik.http.routers.mftik-ws.priority=100"
      - "traefik.http.routers.mftik-ws.service=mftik-api"

  # Symbol plane. Independent lifecycle — up whenever the stack is, so an
  # instrument can be resolved before anything trades.
  sym:
    <<: *mftik
    command: ["sym"]

  md:
    <<: *mftik
    command: ["md"]

  td:
    <<: *mftik
    command: ["td"]

  sts:
    <<: *mftik
    command: ["sts"]
    volumes:
      - sts_eventlog:/var/log/mftik/sts
      - mftik_data:/var/lib/mftik
    environment:
      # The same registry the API writes. STS resolves a session's strategy
      # from these trees, so this has to be the identical volume — not merely
      # a volume of the same shape.
      MFTIK_DATA: /var/lib/mftik
      # A deploy is a restart: sessions interrupted by it are rebuilt on boot.
      STS_REBUILD_ON_BOOT: "1"
      # Per-session audit trail: every event a session was handed and every
      # call it made, one jsonl each. On a volume so a deploy — which replaces
      # this container — does not take the log of the session it interrupted.
      STS_EVENTLOG_DIR: "/var/log/mftik/sts"
      STS_EVENTLOG_QUEUE: "20000"
      # Budget is MAX_BYTES x (BACKUPS + 1) x concurrent sessions, and this
      # host's disk is not big. 128 MB x 3 is 384 MB a session, so ten at once
      # is under 4 GB. Files are per session_id and stay after the session
      # ends — they are the point — so the floor rises until someone prunes
      # the volume. Raise these only after checking `df` on the host.
      STS_EVENTLOG_MAX_BYTES: "134217728"
      STS_EVENTLOG_BACKUPS: "2"

  # Paper exchange engine. Kept in production so the `paper` venue works
  # end-to-end and the deployment can be smoke-tested without real money.
  paper:
    <<: *mftik
    command: ["paper"]

  frontend:
    image: ghcr.io/lynxlinkage/mftik-frontend:${MFTIK_VERSION:-latest}
    restart: unless-stopped
    environment:
      ORIGIN: https://${MFTIK_DOMAIN:?set MFTIK_DOMAIN in .env}
      # Same pin as the image tag, surfaced in the UI's corner badge so the
      # running build is identifiable without SSHing to the host.
      PUBLIC_APP_VERSION: ${MFTIK_VERSION:-latest}
    networks: [web]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.mftik-frontend.rule=Host(`${MFTIK_DOMAIN:?set MFTIK_DOMAIN in .env}`)"
      - "traefik.http.routers.mftik-frontend.entrypoints=websecure"
      - "traefik.http.routers.mftik-frontend.tls.certresolver=le"
      - "traefik.http.routers.mftik-frontend.priority=1"
      - "traefik.http.services.mftik-frontend.loadbalancer.server.port=3000"

volumes:
  # Session event logs. Survives the container a deploy replaces; pruning it is
  # a manual, deliberate act — see the size budget on the sts service.
  sts_eventlog:
  # The strategy registry, shared by api and sts. Source trees, not caches:
  # a session deployed from a pulled strategy cannot be rebuilt without them,
  # so this outlives deploys deliberately.
  mftik_data:

networks:
  web:
    name: web
    external: true

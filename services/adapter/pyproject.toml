[project]
name = "mft-adapter"
version = "0.1.0"
description = "MFT exchange adapter domain"
requires-python = ">=3.12"
dependencies = [
    "mft-broker",
    "mft-protocol",
]

[tool.uv.sources]
mft-broker = { workspace = true }
mft-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_adapter"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_adapter" = "mft_adapter"

[project.scripts]
mft-adapter = "mft_adapter.main:run"

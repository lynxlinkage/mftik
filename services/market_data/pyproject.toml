[project]
name = "mft-market-data"
version = "0.1.0"
description = "MFT market data domain"
requires-python = ">=3.12"
dependencies = [
    "mft-broker",
    "mft-protocol",
]

[tool.uv.sources]
mft-broker = { workspace = true }
mft-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_market_data"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_market_data" = "mft_market_data"

[project.scripts]
mft-market-data = "mft_market_data.main:run"

[project]
name = "mft-strategy"
version = "0.1.0"
description = "MFT strategy domain — algo trading layer"
requires-python = ">=3.12"
dependencies = [
    "mft-broker",
    "mft-protocol",
]

[tool.uv.sources]
mft-broker = { workspace = true }
mft-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_strategy"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_strategy" = "mft_strategy"

[project.scripts]
mft-strategy = "mft_strategy.main:run"

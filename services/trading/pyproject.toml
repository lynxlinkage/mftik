[project]
name = "mft-trading"
version = "0.1.0"
description = "MFT trading domain"
requires-python = ">=3.12"
dependencies = [
    "mft-broker",
    "mft-protocol",
]

[tool.uv.sources]
mft-broker = { workspace = true }
mft-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_trading"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_trading" = "mft_trading"

[project.scripts]
mft-trading = "mft_trading.main:run"

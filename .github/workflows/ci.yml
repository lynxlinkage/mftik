name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package versions agree
        run: scripts/release-check versions
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      # mftik-rt's session tests run a real nats-server (E03-05). Pinned to the
      # version mftiko's go.mod uses; the tests fail when it is missing.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install nats-server
        run: |
          GOBIN="$RUNNER_TEMP/nats-bin" go install github.com/nats-io/nats-server/v2@v2.15.0
          echo "MFTIK_NATS_SERVER=$RUNNER_TEMP/nats-bin/nats-server" >> "$GITHUB_ENV"
      # E07-D002: mftik-rt's eventlog_dump tests read the Rust writer's files
      # with mftiko-eventlog from the pinned commit; they fail when it is missing.
      - name: Install mftiko-eventlog from the pinned mftiko commit
        run: |
          GOBIN="$RUNNER_TEMP/eventlog-bin" bash scripts/install-mftiko-eventlog
          echo "MFTIK_EVENTLOG=$RUNNER_TEMP/eventlog-bin/mftiko-eventlog" >> "$GITHUB_ENV"
      - name: Proto matches the pinned mftiko commit
        run: bash scripts/sync-proto --check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # E01-D006, E04-D007, E04-D014: Python 3.11, the test wheel, unit tests,
  # stubtest, and the Python session e2e. The release wheels are the wheels job.
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install nats-server
        run: |
          GOBIN="$RUNNER_TEMP/nats-bin" go install github.com/nats-io/nats-server/v2@v2.15.0
          echo "MFTIK_NATS_SERVER=$RUNNER_TEMP/nats-bin/nats-server" >> "$GITHUB_ENV"
      - name: Install CPython and headers
        run: |
          sudo apt-get update && sudo apt-get install -y python3-dev
          uv python install 3.11
      - name: Sync dev tools
        run: uv sync --frozen --only-dev --no-install-project --managed-python --python 3.11
      - name: Python user docs
        run: |
          uv run --frozen --no-sync python scripts/check-python-doc-api
          uv run --frozen --no-sync python scripts/check-python-doc-snippets
      - name: Ruff
        run: uv run --frozen --no-sync ruff check python tests/python examples/python examples/rust crates/mftik-py/tests/pystrategies
      - name: Ruff format
        run: uv run --frozen --no-sync ruff format --check python tests/python examples/python examples/rust crates/mftik-py/tests/pystrategies
      - name: Build the mftik wheel
        run: uv run --frozen --no-sync maturin build --release --out dist
      - name: Install the wheel
        run: |
          uv venv --managed-python --python 3.11 /tmp/mftik-smoke
          uv pip install --python /tmp/mftik-smoke/bin/python dist/*.whl
          meta="$(unzip -p dist/*.whl 'mftik-*.dist-info/METADATA')"
          if printf '%s\n' "$meta" | grep -i protobuf; then
            echo "wheel metadata mentions protobuf" >&2
            exit 1
          fi
          unzip -l dist/*.whl | grep -q 'mftik/md/v1.pyi'
          unzip -l dist/*.whl | grep -q 'mftik/td/v1.pyi'
          unzip -l dist/*.whl | grep -q 'mftik/common/v1.pyi'
          uv export --frozen --only-dev --no-emit-project --no-hashes -o /tmp/mftik-dev.txt
          uv pip install --python /tmp/mftik-smoke/bin/python -r /tmp/mftik-dev.txt
      - name: Import smoke
        run: /tmp/mftik-smoke/bin/python tests/python/smoke_import.py
      - name: Python unit tests
        run: /tmp/mftik-smoke/bin/python -m unittest discover -s tests/python -v
      - name: stubtest
        run: |
          cd /tmp
          /tmp/mftik-smoke/bin/python -m mypy.stubtest mftik._mftik
          /tmp/mftik-smoke/bin/python -m mypy.stubtest mftik.common.v1 mftik.md.v1 mftik.td.v1
          /tmp/mftik-smoke/bin/python -m mypy.stubtest mftik.topic
          # One process, given both names, sees the venv's mftik.volume twice
          # (cwd is /tmp, so the same stub is a relative path and an absolute one).
          /tmp/mftik-smoke/bin/python -m mypy.stubtest mftik
          /tmp/mftik-smoke/bin/python -m mypy.stubtest mftik.volume
      - name: Python session and hook e2e
        run: |
          test -n "$MFTIK_NATS_SERVER"
          test -x /tmp/mftik-smoke/bin/python
          MFTIK_PYTHON=/tmp/mftik-smoke/bin/python cargo test -p mftik-py --test session --test context --test reads --test hooks -- --ignored --test-threads=1

  # E04-D063, E06-D019: the two release wheels. Same matrix as release.yml.
  # No sdist. The Linux wheel is pinned to ubuntu-22.04, not ubuntu-latest:
  # its manylinux_2_35 tag is that runner's glibc.
  wheels:
    name: wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: manylinux_2_35_x86_64
            cargo_jobs: "4"
          - os: macos-latest
            platform: macos_arm64
            cargo_jobs: "1"
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wheel
        with:
          platform: ${{ matrix.platform }}

  # Temporary copy only. The committed proto tree is not edited.
  proto-drift:
    name: proto-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drifted proto fails the consistency check
        run: bash scripts/sync-proto-negative

  # E03-D007: the Rust standard strategy (examples/conform) against the
  # pinned mftiko-conformance. Any fail fails the job; the report is kept.
  mftiko-conformance:
    name: mftiko-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install mftiko-conformance from the pinned mftiko commit
        run: |
          GOBIN="$RUNNER_TEMP/conformance-bin" bash scripts/install-mftiko-conformance
          echo "$RUNNER_TEMP/conformance-bin" >> "$GITHUB_PATH"
      - name: Build the conform strategy
        run: cargo build --release -p mftik-conform
      - name: Run mftiko-conformance
        run: mftiko-conformance -json report.json -- target/release/conform
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mftiko-conformance-report
          path: report.json
          if-no-files-found: warn

  # E05-D011: one abi3 wheel, installed by the three Python conformance jobs.
  python-conform-wheel:
    name: python-conform-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: Install CPython headers
        run: |
          sudo apt-get update && sudo apt-get install -y python3-dev
          uv python install 3.11
      - name: Sync dev tools
        run: uv sync --frozen --only-dev --no-install-project --managed-python --python 3.11
      - name: Build one abi3 wheel
        run: uv run --frozen --no-sync maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: mftik-abi3-wheel
          path: dist/*.whl
          if-no-files-found: error

  # E05-D001, E05-D002, E05-D011: the same suite as mftiko-conformance, on the
  # Python strategy, once per supported interpreter. The pinned harness
  # replaces the worker environment and does not forward PYTHONPATH, so the
  # venv path file puts examples/python on sys.path. The argv is still
  # `python -m mftik.run conform:Conform`.
  mftiko-conformance-python:
    name: mftiko-conformance-python (${{ matrix.python }})
    needs: python-conform-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install mftiko-conformance from the pinned mftiko commit
        run: |
          GOBIN="$RUNNER_TEMP/conformance-bin" bash scripts/install-mftiko-conformance
          echo "$RUNNER_TEMP/conformance-bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: mftik-abi3-wheel
          path: dist
      - name: Install the wheel into a clean venv
        run: |
          set -euo pipefail
          uv python install "${{ matrix.python }}"
          uv venv --managed-python --python "${{ matrix.python }}" /tmp/mftik-conform
          uv pip install --python /tmp/mftik-conform/bin/python dist/*.whl
          site="$(/tmp/mftik-conform/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          printf '%s\n' "$GITHUB_WORKSPACE/examples/python" > "$site/mftik-conform.pth"
      - name: Run mftiko-conformance
        env:
          PYTHONPATH: ${{ github.workspace }}/examples/python
        run: mftiko-conformance -json report.json -- /tmp/mftik-conform/bin/python -m mftik.run conform:Conform
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mftiko-conformance-python-${{ matrix.python }}
          path: report.json
          if-no-files-found: warn

  # E04-D076: pack one strategy into a local registry:2, check it with the
  # pinned mftiko artifact package, and run the unpacked rootfs. The checkout
  # is dd73a2d421ca. This job does not push anywhere but 127.0.0.1.
  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install nats-server
        run: |
          GOBIN="$RUNNER_TEMP/nats-bin" go install github.com/nats-io/nats-server/v2@v2.15.0
          echo "MFTIK_NATS_SERVER=$RUNNER_TEMP/nats-bin/nats-server" >> "$GITHUB_ENV"
      - name: Install CPython headers
        run: |
          sudo apt-get update && sudo apt-get install -y python3-dev
          uv python install 3.11
      - name: Sync dev tools
        run: uv sync --frozen --only-dev --no-install-project --managed-python --python 3.11
      - name: Pack, check, and run
        run: uv run --frozen --no-sync python tests/python/pack_e2e.py

  # #455 (mftiko E15-06, E15-D010): a data artifact pushed with the pinned
  # mftiko-pack data, unpacked read-only the way the STS agent stages an input,
  # and read by examples/python/pretrained from the packed rootfs. One
  # interpreter: the input path does not depend on it, and the PyO3 layer is
  # covered on 3.11-3.13 by mftiko-conformance-python (E05-D002).
  data-input:
    name: data-input
    needs: python-conform-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install nats-server
        run: |
          GOBIN="$RUNNER_TEMP/nats-bin" go install github.com/nats-io/nats-server/v2@v2.15.0
          echo "MFTIK_NATS_SERVER=$RUNNER_TEMP/nats-bin/nats-server" >> "$GITHUB_ENV"
      - name: Install CPython headers
        run: |
          sudo apt-get update && sudo apt-get install -y python3-dev
          uv python install 3.11
      - uses: actions/download-artifact@v4
        with:
          name: mftik-abi3-wheel
          path: dist
      - name: Push the input, pack, unpack, and run
        run: |
          set -euo pipefail
          wheel=(dist/*.whl)
          MFTIK_PACK_WHEEL="${wheel[0]}" python3 tests/python/data_input_e2e.py

  # E05-D021–E05-D025: pack examples/python/conform once per interpreter, unpack
  # with the pinned mftiko artifact client, and run mftiko-conformance in that
  # rootfs. The pack job is unchanged. The wheel is python-conform-wheel's
  # mftik-abi3-wheel artifact; this job does not build one.
  conformance-rootfs:
    name: conformance-rootfs (${{ matrix.python }})
    needs: python-conform-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install mftiko-conformance from the pinned mftiko commit
        run: |
          GOBIN="$RUNNER_TEMP/conformance-bin" bash scripts/install-mftiko-conformance
      - uses: actions/download-artifact@v4
        with:
          name: mftik-abi3-wheel
          path: dist
      - name: Pack the rootfs and run mftiko-conformance
        env:
          MFTIK_PYTHON: ${{ matrix.python }}
          MFTIK_WHEEL_DIR: dist
          MFTIK_CONFORMANCE: ${{ runner.temp }}/conformance-bin/mftiko-conformance
          MFTIK_REPORT: ${{ github.workspace }}/report-rootfs.json
        run: python3 tests/python/conformance_rootfs.py
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mftiko-conformance-rootfs-${{ matrix.python }}
          path: report-rootfs.json
          if-no-files-found: warn

  # E08-D001, E08-D002, E08-D005 (#479): examples/conform packed with the
  # pinned mftiko-pack -bin, unpacked with the pinned mftiko artifact package,
  # and run with mftiko-conformance in that rootfs. E08-D009 (#480):
  # examples/rust/md_watch packed and unpacked the same way, and run from its
  # rootfs under the Python md_watch harness. ubuntu-22.04 is the glibc 2.35
  # baseline: the binaries are built and run there.
  conformance-rootfs-rust:
    name: conformance-rootfs-rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Runner has glibc 2.35
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install mftiko-conformance from the pinned mftiko commit
        run: GOBIN="$RUNNER_TEMP/conformance-bin" bash scripts/install-mftiko-conformance
      # The md_watch harness runs a real nats-server, the version the rust job pins.
      - name: Install nats-server
        run: |
          GOBIN="$RUNNER_TEMP/nats-bin" go install github.com/nats-io/nats-server/v2@v2.15.0
          echo "MFTIK_NATS_SERVER=$RUNNER_TEMP/nats-bin/nats-server" >> "$GITHUB_ENV"
      - name: Build the Rust strategies
        run: cargo build --release -p mftik-conform -p mftik-md-watch
      - name: Pack the binaries and run them in their rootfs
        env:
          MFTIK_CONFORM_BIN: ${{ github.workspace }}/target/release/conform
          MFTIK_MD_WATCH_BIN: ${{ github.workspace }}/target/release/md_watch
          MFTIK_CONFORMANCE: ${{ runner.temp }}/conformance-bin/mftiko-conformance
          MFTIK_REPORT: ${{ github.workspace }}/report-rootfs-rust.json
        run: python3.11 tests/python/conformance_rootfs_rust.py
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mftiko-conformance-rootfs-rust
          path: report-rootfs-rust.json
          if-no-files-found: warn

  # E05-D031–E05-D035: md_watch, maker, stateful, pretrained, and sampler.
  # The wheel is python-conform-wheel's mftik-abi3-wheel artifact; this job
  # does not build one. Pack builds each image and does not push it.
  examples:
    name: examples
    needs: python-conform-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install nats-server
        run: |
          GOBIN="$RUNNER_TEMP/nats-bin" go install github.com/nats-io/nats-server/v2@v2.15.0
          echo "MFTIK_NATS_SERVER=$RUNNER_TEMP/nats-bin/nats-server" >> "$GITHUB_ENV"
      - name: Install CPython headers
        run: |
          sudo apt-get update && sudo apt-get install -y python3-dev
          uv python install 3.11
      - uses: actions/download-artifact@v4
        with:
          name: mftik-abi3-wheel
          path: dist
      - name: Install the wheel into a clean venv
        run: |
          set -euo pipefail
          uv venv --managed-python --python 3.11 /tmp/mftik-examples
          uv pip install --python /tmp/mftik-examples/bin/python dist/*.whl
      - name: Run the example end-to-end tests
        env:
          MFTIK_PYTHON: /tmp/mftik-examples/bin/python
        run: |
          set -euo pipefail
          test -n "$MFTIK_NATS_SERVER"
          test -x "$MFTIK_PYTHON"
          for name in md_watch maker stateful pretrained sampler; do
            "$MFTIK_PYTHON" "examples/python/$name/test_e2e.py"
          done
      - name: Pack each example without pushing
        run: |
          set -euo pipefail
          wheel=(dist/*.whl)
          py=/tmp/mftik-examples/bin/python
          for spec in md_watch:MdWatch maker:Maker stateful:Stateful pretrained:Pretrained sampler:Sampler; do
            name="${spec%%:*}"
            "$py" -m mftik.pack \
              -dir "examples/python/$name" \
              -target "$spec" \
              -name "$name" \
              -repo "127.0.0.1:9/mftik/$name" \
              -python 3.11 \
              -wheel "${wheel[0]}" \
              -no-push
          done

name: Build, Notify

# Tags only. Nothing ships from this repo any more — a push to main builds
# nothing, and a tag builds images that a human pulls when they choose to.
# Tests run here rather than only in tests.yml (which is PR-only) so a red suite
# stops the release instead of publishing an image nobody should pull.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/mftik
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mftik-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    # Same matrix as tests.yml — see the note there for why sqlite alone will
    # not do. A release must not be gated on a weaker suite than a PR is.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mftik
          POSTGRES_PASSWORD: mftik
          POSTGRES_DB: mftik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mftik -d mftik_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://mftik:mftik@localhost:5432/mftik_test
      DATABASE_URL_SYNC: postgresql+psycopg://mftik:mftik@localhost:5432/mftik_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-packages

      - name: Lint
        run: uv run --all-packages ruff check packages apps conftest.py

      # Whoever runs these images runs `alembic upgrade head` first. This is the
      # only place that proves the result of doing so matches the models the
      # images are built from.
      - name: Migrations match the models
        run: |
          uv run --all-packages alembic -c packages/db/alembic.ini upgrade head
          uv run --all-packages alembic -c packages/db/alembic.ini check

      - name: Test
        run: uv run --all-packages pytest packages apps -q
      - name: Contracts up to date
        run: |
          uv run --all-packages python -c \
            "import json; from mftik_api.main import app; print(json.dumps(app.openapi(), indent=2))" \
            > /tmp/openapi.json
          diff -u contracts/openapi.json /tmp/openapi.json \
            || { echo "contracts/openapi.json is stale — run: just openapi" >&2; exit 1; }

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # `v1.2.3` on a tag run; the branch name on a manual one, which is why
      # `latest` below only moves for an actual tag.
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # One image for api, td, md, sts, sym, paper and the migrator — they
      # differ only by `command:` in deploy/docker-compose.yml.
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ github.ref_type == 'tag' && format('{0}:latest', env.APP_IMAGE) || '' }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ github.ref_type == 'tag' && format('{0}:latest', env.FRONTEND_IMAGE) || '' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  notify:
    needs: [test, build]
    if: always()
    runs-on: ubuntu-latest
    # Job level, not step level: the `secrets` context is not available in a
    # step's `if`, but `env` is — and job-level env may read secrets.
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      # Name the stage that stopped it, and say what that means for the
      # registry — "failed" alone sends you to the logs to find out whether an
      # image was published. The stages are checked in pipeline order because
      # only the first non-success actually broke; the ones after it report
      # `skipped`, which is not a failure worth naming.
      - name: Determine status
        id: status
        env:
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$TEST" != "success" ]; then
            title="❌ Tests failed"
            desc="Nothing was built. No image was published."
            color=15158332
          elif [ "$BUILD" != "success" ]; then
            title="❌ Build failed"
            desc="No image was published for this tag."
            color=15158332
          else
            title="✅ Images published"
            desc="Tagged images are on GHCR and ready to pull."
            color=3066993
          fi
          {
            echo "title=$title"
            echo "desc=$desc"
            echo "color=$color"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ env.WEBHOOK_URL != '' }}
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          TITLE: ${{ steps.status.outputs.title }}
          DESC: ${{ steps.status.outputs.desc }}
          COLOR: ${{ steps.status.outputs.color }}
        run: |
          # Piped rather than passed with -d "$(...)": the payload carries text
          # we did not write, and argv is the wrong place for it.
          jq -n \
            --arg title "mftik $VERSION: $TITLE" \
            --arg desc "$DESC" \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg version "$VERSION" \
            --arg commit "[\`${COMMIT_SHA:0:7}\`](${SERVER_URL}/${REPO}/commit/${COMMIT_SHA})" \
            --arg run "[View logs](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson color "$COLOR" \
            '{embeds: [{
              title: $title,
              description: $desc,
              color: $color,
              fields: [
                {name: "Repository", value: $repo, inline: true},
                {name: "Version", value: $version, inline: true},
                {name: "Triggered by", value: $actor, inline: true},
                {name: "Commit", value: $commit, inline: false},
                {name: "Workflow Run", value: $run, inline: false}
              ],
              timestamp: $ts
            }]}' \
          | curl -sf -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK_URL"

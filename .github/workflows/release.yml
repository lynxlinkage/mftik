name: Build images

# Tags only. A push to main builds nothing. A tag builds images, and a final
# tag (no hyphen) then rolls the plane AssignmentSets on Strategon and the API
# compose on the host.
#
# Only the plane layer. The infra layer — NATS and the regional Redis, in
# `deployment/sets/infra.json` — is applied by hand and does not move with a
# tag: the bus and the tape disk have no reason to restart because a strategy
# changed, and a tag that rolled them would take every session down with it.
# See docs/Deployment.md.
# Tests run here rather than only in tests.yml (which is PR-only) so a red suite
# stops the release instead of publishing an image nobody should pull.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/mftik
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mftik-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    # Same matrix as tests.yml — see the note there for why sqlite alone will
    # not do. A release must not be gated on a weaker suite than a PR is.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mftik
          POSTGRES_PASSWORD: mftik
          POSTGRES_DB: mftik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mftik -d mftik_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://mftik:mftik@localhost:5432/mftik_test
      DATABASE_URL_SYNC: postgresql+psycopg://mftik:mftik@localhost:5432/mftik_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      # The bus. Core NATS; no JetStream. `conftest.py` fails the run
      # if nothing is listening at all.
      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            nats:2.11-alpine -m 8222
          for _ in $(seq 30); do
            if curl -sf http://localhost:8222/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::nats-server did not come up" >&2
          docker logs nats >&2 || true
          exit 1

      - name: Sync
        run: uv sync --all-packages

      - name: Lint
        run: uv run --all-packages ruff check packages apps conftest.py

      # Whoever runs these images runs `alembic upgrade head` first. This is the
      # only place that proves the result of doing so matches the models the
      # images are built from.
      - name: Migrations match the models
        run: |
          uv run --all-packages alembic -c packages/db/alembic.ini upgrade head
          uv run --all-packages alembic -c packages/db/alembic.ini check

      - name: Test
        run: uv run --all-packages pytest packages apps -q
      - name: Contracts up to date
        run: |
          uv run --all-packages python -c \
            "import json; from mftik_api.main import app; print(json.dumps(app.openapi(), indent=2))" \
            > /tmp/openapi.json
          diff -u contracts/openapi.json /tmp/openapi.json \
            || { echo "contracts/openapi.json is stale — run: just openapi" >&2; exit 1; }

  # Each architecture on a runner that is that architecture, then one manifest
  # list stitched from the digests. QEMU worked and cost about five minutes,
  # but emulating a CPU to compile for it is a strange thing to do when GitHub
  # hands out arm64 hardware for free on a public repository.
  #
  # Nothing here pushes a tag. Each build pushes by digest only, and `merge`
  # is what makes those digests answer to `v1.2.3` — so a half-finished matrix
  # leaves the old tag intact rather than a manifest missing an architecture.
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # context and target are spelled out per row rather than derived with
        # `image == 'app' && '' || 'prod'`. An empty string is falsy in a
        # GitHub expression, so that idiom returns the right-hand side for the
        # row it was meant to leave blank — the app image asked for the
        # frontend's `prod` stage and failed on a target that is not in its
        # Dockerfile.
        include:
          - image: app
            context: "."
            target: ""
            platform: linux/amd64
            runner: ubuntu-latest
          - image: app
            context: "."
            target: ""
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: frontend
            context: "./frontend"
            target: "prod"
            platform: linux/amd64
            runner: ubuntu-latest
          - image: frontend
            context: "./frontend"
            target: "prod"
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ matrix.image == 'app' && env.APP_IMAGE || env.FRONTEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture: one cache shared by both would be two
          # architectures evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      # The digest is all `merge` needs, and an empty file named for it is the
      # smallest thing that survives an artifact round trip. The `sha256:`
      # prefix comes off because a colon is not allowed in an artifact path,
      # and `merge` puts it back.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          # `/` is not allowed in an artifact name, and linux/amd64 has one.
          name: digests-${{ matrix.image }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what `mftik node-init` writes into a generated stack, so
      # moving it points every self-hosted node at whatever was tagged last.
      # Only a real, final tag earns it: a manual run builds images that can be
      # pulled by name and redirect nobody, and neither does a pre-release —
      # `v0.0.3-rc1` exists precisely to be tried without becoming what
      # everyone gets by default.
      - name: Create the manifest list
        env:
          NAME: ${{ matrix.image == 'app' && env.APP_IMAGE || env.FRONTEND_IMAGE }}
          VERSION: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          cd /tmp/digests
          tags="-t ${NAME}:${VERSION}"
          case "$VERSION" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          if [ "$IS_TAG" = "true" ] && [ "$prerelease" = "false" ]; then
            tags="$tags -t ${NAME}:latest"
          else
            echo "not moving :latest (tag=$IS_TAG prerelease=$prerelease)"
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create $tags \
            $(printf "${NAME}@sha256:%s " *)
          docker buildx imagetools inspect "${NAME}:${VERSION}"

  # The plane layer: docker save the amd64 app image, register it under each
  # set's artifact family, then ApplyAssignmentSet for td / sts / md / sym /
  # paper. Each set rolls its own members one at a time, so a TD restart — which
  # now reaps every session in its name — is not simultaneous in both regions.
  #
  # Prereleases do not roll production, for the same reason they do not move
  # :latest.
  planes:
    needs: merge
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the amd64 app image
        env:
          IMAGE: ${{ env.APP_IMAGE }}:${{ github.ref_name }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE"
          docker save "$IMAGE" -o /tmp/mftik.tar
          ls -lh /tmp/mftik.tar

      - name: Apply the plane sets
        env:
          STRATEGON_API_KEY: ${{ secrets.STRATEGON_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
        run: |
          python3 scripts/s7n_apply_sets.py \
            --spec deployment/sets/planes.json \
            --version "${{ github.ref_name }}" \
            --tar /tmp/mftik.tar \
            --wait-seconds 300

  # API + frontend on the compose host. Down, keep the previous file as
  # docker-compose.bak.<shortsha>.yml, scp this repo's file, start. A failed
  # start or a silent site puts the bak back and ups it.
  api:
    needs: merge
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Roll the host compose
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSE_FILE: deployment/docker-compose.yml
        run: |
          chmod +x scripts/deploy_prod_compose.sh
          SHORT_SHA="${SHORT_SHA:0:7}" scripts/deploy_prod_compose.sh

  notify:
    needs: [test, build, merge, planes, api]
    if: always()
    runs-on: ubuntu-latest
    # Job level, not step level: the `secrets` context is not available in a
    # step's `if`, but `env` is — and job-level env may read secrets.
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      # Name the stage that stopped it, and say what that means for the
      # registry — "failed" alone sends you to the logs to find out whether an
      # image was published. The stages are checked in pipeline order because
      # only the first non-success actually broke; the ones after it report
      # `skipped`, which is not a failure worth naming.
      - name: Determine status
        id: status
        env:
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          MERGE: ${{ needs.merge.result }}
          PLANES: ${{ needs.planes.result }}
          API: ${{ needs.api.result }}
        run: |
          if [ "$TEST" != "success" ]; then
            title="❌ Tests failed"
            desc="Nothing was built. No image was published."
            color=15158332
          elif [ "$BUILD" != "success" ]; then
            title="❌ Build failed"
            desc="No image was published for this tag."
            color=15158332
          elif [ "$MERGE" != "success" ]; then
            # The per-architecture builds push by digest and tag nothing, so
            # this leaves layers in the registry that no tag points at and the
            # previous release still answering to :latest. Nothing is broken;
            # this version is simply not published.
            title="❌ Manifest merge failed"
            desc="Architectures built but were never tagged. No image was published for this tag."
            color=15158332
          elif [ "$PLANES" != "success" ] && [ "$PLANES" != "skipped" ]; then
            title="❌ Plane sets failed"
            desc="Images are on GHCR, but the plane sets were not rolled to this tag. A set that rolled partway auto-rolls back per member; check which members are on which version."
            color=15158332
          elif [ "$API" != "success" ] && [ "$API" != "skipped" ]; then
            title="❌ API compose failed"
            desc="Planes are on this tag. The host compose was put back to the previous file."
            color=15158332
          elif [ "$PLANES" = "skipped" ] || [ "$API" = "skipped" ]; then
            title="✅ Images published"
            desc="Tagged images are on GHCR. Prerelease or manual run — production was not touched."
            color=3066993
          else
            title="✅ Deployed"
            desc="Images are on GHCR. The plane sets and the API compose are on this tag. Infra (NATS, Redis) is unchanged by design."
            color=3066993
          fi
          {
            echo "title=$title"
            echo "desc=$desc"
            echo "color=$color"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ env.WEBHOOK_URL != '' }}
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          TITLE: ${{ steps.status.outputs.title }}
          DESC: ${{ steps.status.outputs.desc }}
          COLOR: ${{ steps.status.outputs.color }}
        run: |
          # Piped rather than passed with -d "$(...)": the payload carries text
          # we did not write, and argv is the wrong place for it.
          jq -n \
            --arg title "mftik $VERSION: $TITLE" \
            --arg desc "$DESC" \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg version "$VERSION" \
            --arg commit "[\`${COMMIT_SHA:0:7}\`](${SERVER_URL}/${REPO}/commit/${COMMIT_SHA})" \
            --arg run "[View logs](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson color "$COLOR" \
            '{embeds: [{
              title: $title,
              description: $desc,
              color: $color,
              fields: [
                {name: "Repository", value: $repo, inline: true},
                {name: "Version", value: $version, inline: true},
                {name: "Triggered by", value: $actor, inline: true},
                {name: "Commit", value: $commit, inline: false},
                {name: "Workflow Run", value: $run, inline: false}
              ],
              timestamp: $ts
            }]}' \
          | curl -sf -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK_URL"

name: Build, Deploy, Notify

# Tags only. Nothing ships from this repo any more — a push to main builds
# nothing, and a tag builds images that a human pulls when they choose to.
# Tests run here rather than only in tests.yml (which is PR-only) so a red suite
# stops the release instead of publishing an image nobody should pull.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/mftik
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mftik-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    # Same matrix as tests.yml — see the note there for why sqlite alone will
    # not do. A release must not be gated on a weaker suite than a PR is.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mftik
          POSTGRES_PASSWORD: mftik
          POSTGRES_DB: mftik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mftik -d mftik_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://mftik:mftik@localhost:5432/mftik_test
      DATABASE_URL_SYNC: postgresql+psycopg://mftik:mftik@localhost:5432/mftik_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-packages

      - name: Lint
        run: uv run --all-packages ruff check packages apps conftest.py

      # Whoever runs these images runs `alembic upgrade head` first. This is the
      # only place that proves the result of doing so matches the models the
      # images are built from.
      - name: Migrations match the models
        run: |
          uv run --all-packages alembic -c packages/db/alembic.ini upgrade head
          uv run --all-packages alembic -c packages/db/alembic.ini check

      - name: Test
        run: uv run --all-packages pytest packages apps -q
      - name: Contracts up to date
        run: |
          uv run --all-packages python -c \
            "import json; from mftik_api.main import app; print(json.dumps(app.openapi(), indent=2))" \
            > /tmp/openapi.json
          diff -u contracts/openapi.json /tmp/openapi.json \
            || { echo "contracts/openapi.json is stale — run: just openapi" >&2; exit 1; }

  # Each architecture on a runner that is that architecture, then one manifest
  # list stitched from the digests. QEMU worked and cost about five minutes,
  # but emulating a CPU to compile for it is a strange thing to do when GitHub
  # hands out arm64 hardware for free on a public repository.
  #
  # Nothing here pushes a tag. Each build pushes by digest only, and `merge`
  # is what makes those digests answer to `v1.2.3` — so a half-finished matrix
  # leaves the old tag intact rather than a manifest missing an architecture.
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # context and target are spelled out per row rather than derived with
        # `image == 'app' && '' || 'prod'`. An empty string is falsy in a
        # GitHub expression, so that idiom returns the right-hand side for the
        # row it was meant to leave blank — the app image asked for the
        # frontend's `prod` stage and failed on a target that is not in its
        # Dockerfile.
        include:
          - image: app
            context: "."
            target: ""
            platform: linux/amd64
            runner: ubuntu-latest
          - image: app
            context: "."
            target: ""
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: frontend
            context: "./frontend"
            target: "prod"
            platform: linux/amd64
            runner: ubuntu-latest
          - image: frontend
            context: "./frontend"
            target: "prod"
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ matrix.image == 'app' && env.APP_IMAGE || env.FRONTEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture: one cache shared by both would be two
          # architectures evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      # The digest is all `merge` needs, and an empty file named for it is the
      # smallest thing that survives an artifact round trip. The `sha256:`
      # prefix comes off because a colon is not allowed in an artifact path,
      # and `merge` puts it back.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          # `/` is not allowed in an artifact name, and linux/amd64 has one.
          name: digests-${{ matrix.image }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what `mftik node-init` writes into a generated stack, so
      # moving it points every self-hosted node at whatever was tagged last.
      # Only a real, final tag earns it: a manual run builds images that can be
      # pulled by name and redirect nobody, and neither does a pre-release —
      # `v0.0.3-rc1` exists precisely to be tried without becoming what
      # everyone gets by default.
      - name: Create the manifest list
        env:
          NAME: ${{ matrix.image == 'app' && env.APP_IMAGE || env.FRONTEND_IMAGE }}
          VERSION: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          cd /tmp/digests
          tags="-t ${NAME}:${VERSION}"
          case "$VERSION" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          if [ "$IS_TAG" = "true" ] && [ "$prerelease" = "false" ]; then
            tags="$tags -t ${NAME}:latest"
          else
            echo "not moving :latest (tag=$IS_TAG prerelease=$prerelease)"
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create $tags \
            $(printf "${NAME}@sha256:%s " *)
          docker buildx imagetools inspect "${NAME}:${VERSION}"

  # mftik.lynkora.com. `merge` is what makes a tag answer to anything, so this
  # waits on it and not on `build`: the per-architecture jobs push by digest
  # and tag nothing, and a deploy that ran between them would pull the tag the
  # previous release left behind and report success for shipping nothing.
  #
  # Prereleases do not deploy, for the reason they do not move :latest —
  # `v0.0.3-rc1` exists to be pulled by name and tried, not to become what
  # mftik.lynkora.com is running. The guard is the same `-` test `merge` uses.
  deploy:
    needs: merge
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The host pulls from GHCR with the token this job hands it.
      packages: read
    environment:
      name: production
      url: https://mftik.lynkora.com
    steps:
      # Pinned to a commit rather than v1.2.5, because this step is handed a
      # key that opens a root shell on the host and a tag is a mutable pointer
      # owned by somebody else. Bump it deliberately, not by re-running.
      - name: Point the stack at this tag and roll it
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          VERSION: ${{ github.ref_name }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Forwarded as environment, not interpolated. `script` is assembled
          # as text on the runner, so a `${{ }}` inside it is substitution
          # into a shell program rather than a value passed to one.
          envs: VERSION,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/mftik/deploy

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Traefik (/opt/traefik, its own compose project) owns this
            # network and the stack declares it external. Creating it is a
            # no-op every time except on a host where it has gone missing,
            # where it is the difference between a deploy and an error.
            docker network inspect web >/dev/null 2>&1 || docker network create web

            # One line, and only this line. The rest of .env is secrets this
            # workflow has never held — venue keys, OAuth, database URLs — and
            # the backup is what makes a bad rewrite recoverable without
            # having to go and find those values again.
            cp .env ".env.bak-$(date +%Y%m%d-%H%M%S)"
            sed -i "s|^MFTIK_VERSION=.*|MFTIK_VERSION=${VERSION}|" .env
            grep "^MFTIK_VERSION=" .env

            docker compose pull

            # Before `up -d`, not alongside it. The new images expect the new
            # schema, and a migration that fails should leave the previous
            # version serving rather than half the stack upgraded. `migrate`
            # sits in the `tools` profile precisely so `up -d` never runs it.
            docker compose --profile tools run --rm migrate

            docker compose up -d

            # The images the previous version was running are now untagged.
            docker image prune -f

      # `docker compose up -d` returning 0 means the containers were created,
      # which is not the same claim as the site being back. Traefik takes a
      # moment to notice them, so this retries instead of asserting once.
      #
      # 401 from the API is the pass condition, not a failure: auth is on in
      # production and an unauthenticated probe is supposed to be refused.
      # What this is looking for is 502 — Traefik routing with nothing behind
      # it — and 000, which is nothing answering at all.
      - name: The site answers
        run: |
          for attempt in $(seq 1 30); do
            front=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              https://mftik.lynkora.com/ || echo 000)
            api=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              https://mftik.lynkora.com/api/auth/me || echo 000)
            echo "attempt ${attempt}: frontend=${front} api=${api}"
            if [ "$front" = "200" ] && { [ "$api" = "200" ] || [ "$api" = "401" ]; }; then
              echo "mftik.lynkora.com is serving ${GITHUB_REF_NAME}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::mftik.lynkora.com did not come back up after the deploy" >&2
          exit 1

  notify:
    needs: [test, build, merge, deploy]
    if: always()
    runs-on: ubuntu-latest
    # Job level, not step level: the `secrets` context is not available in a
    # step's `if`, but `env` is — and job-level env may read secrets.
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      # Name the stage that stopped it, and say what that means for the
      # registry — "failed" alone sends you to the logs to find out whether an
      # image was published. The stages are checked in pipeline order because
      # only the first non-success actually broke; the ones after it report
      # `skipped`, which is not a failure worth naming.
      - name: Determine status
        id: status
        env:
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          MERGE: ${{ needs.merge.result }}
          # `skipped` on a prerelease, which is the intended outcome and not
          # a failure — the branches below separate the two.
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          if [ "$TEST" != "success" ]; then
            title="❌ Tests failed"
            desc="Nothing was built. No image was published."
            color=15158332
          elif [ "$BUILD" != "success" ]; then
            title="❌ Build failed"
            desc="No image was published for this tag."
            color=15158332
          elif [ "$MERGE" != "success" ]; then
            # The per-architecture builds push by digest and tag nothing, so
            # this leaves layers in the registry that no tag points at and the
            # previous release still answering to :latest. Nothing is broken;
            # this version is simply not published.
            title="❌ Manifest merge failed"
            desc="Architectures built but were never tagged. No image was published for this tag."
            color=15158332
          elif [ "$DEPLOY" != "success" ] && [ "$DEPLOY" != "skipped" ]; then
            # The images are real and pullable; only the rollout failed. Worth
            # saying, because the fix is a re-run of this job and not a retag.
            title="❌ Deploy failed"
            desc="Images published, but mftik.lynkora.com is still on the previous version."
            color=15158332
          elif [ "$DEPLOY" = "skipped" ]; then
            title="✅ Images published"
            desc="Tagged images are on GHCR. Prerelease — production was not touched."
            color=3066993
          else
            title="✅ Deployed"
            desc="Images are on GHCR and mftik.lynkora.com is serving this version."
            color=3066993
          fi
          {
            echo "title=$title"
            echo "desc=$desc"
            echo "color=$color"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ env.WEBHOOK_URL != '' }}
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          TITLE: ${{ steps.status.outputs.title }}
          DESC: ${{ steps.status.outputs.desc }}
          COLOR: ${{ steps.status.outputs.color }}
        run: |
          # Piped rather than passed with -d "$(...)": the payload carries text
          # we did not write, and argv is the wrong place for it.
          jq -n \
            --arg title "mftik $VERSION: $TITLE" \
            --arg desc "$DESC" \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg version "$VERSION" \
            --arg commit "[\`${COMMIT_SHA:0:7}\`](${SERVER_URL}/${REPO}/commit/${COMMIT_SHA})" \
            --arg run "[View logs](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson color "$COLOR" \
            '{embeds: [{
              title: $title,
              description: $desc,
              color: $color,
              fields: [
                {name: "Repository", value: $repo, inline: true},
                {name: "Version", value: $version, inline: true},
                {name: "Triggered by", value: $actor, inline: true},
                {name: "Commit", value: $commit, inline: false},
                {name: "Workflow Run", value: $run, inline: false}
              ],
              timestamp: $ts
            }]}' \
          | curl -sf -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK_URL"

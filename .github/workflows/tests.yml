name: Tests

on:
  pull_request:
  # Also on main: nothing builds from a push to main any more (release.yml is
  # tag-only), so without this a commit that lands outside a PR would go
  # untested until someone cut a tag.
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Every database test runs twice: once on in-memory sqlite, once here.
    # sqlite alone is not a stand-in — it has no decimal type and ignores
    # VARCHAR length, so a column too small for what a venue sends looks fine.
    # `conftest.py` fails the run outright if this service did not come up,
    # rather than letting the suite quietly pass on sqlite only.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mftik
          POSTGRES_PASSWORD: mftik
          POSTGRES_DB: mftik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mftik -d mftik_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://mftik:mftik@localhost:5432/mftik_test
      DATABASE_URL_SYNC: postgresql+psycopg://mftik:mftik@localhost:5432/mftik_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-packages

      # First because it is the fastest thing here and needs no service.
      - name: Lint
        run: uv run --all-packages ruff check packages apps conftest.py

      # Also gates the release. It lived only there until a PR that added two
      # endpoints went green here and broke main on merge — a PR must not pass
      # a weaker suite than a release runs. Early, since it needs no service.
      - name: Contracts up to date
        run: |
          uv run --all-packages python -c \
            "import json; from mftik_api.main import app; print(json.dumps(app.openapi(), indent=2))" \
            > /tmp/openapi.json
          diff -u contracts/openapi.json /tmp/openapi.json \
            || { echo "contracts/openapi.json is stale — run: just openapi" >&2; exit 1; }

      # Before the tests, which build their schema from the models and would
      # leave a database no migration has ever touched. The suite proves the
      # models work; this proves a deploy would arrive at the same models.
      - name: Migrations match the models
        run: |
          uv run --all-packages alembic -c packages/db/alembic.ini upgrade head
          uv run --all-packages alembic -c packages/db/alembic.ini check

      - name: Test
        run: uv run --all-packages pytest packages apps -q

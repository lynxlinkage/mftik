name: Tests

on:
  # Scoped to main: a bare `push` would also fire for branches with an open
  # PR, running the same suite twice for every push to that PR.
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-packages
      - name: Test
        run: uv run --all-packages pytest packages apps -q

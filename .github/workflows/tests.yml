name: Tests

on:
  # PRs only. The same suite runs as the first job of deploy.yml on push to
  # main, where it gates the release — running it here too would just duplicate
  # every main build.
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-packages
      - name: Test
        run: uv run --all-packages pytest packages apps -q

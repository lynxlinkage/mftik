name: Baseline test durations

# One-off, for B0-02 (#155): F30 budgets `just test` at two minutes on
# `ubuntu-latest` and F31 assumes we know whether NATS is what makes the suite
# slow. Nobody had measured either. This job measures both on the runner the
# budget names, fills appendix C of docs/ARCHITECTURE_CHANGE_PLAN.md, and is
# deleted in the same PR — B2-04 (#177) is where a duration gate joins normal
# CI for good. The paths filter is why it costs every other PR nothing.
on:
  pull_request:
    paths:
      - .github/workflows/baseline-durations.yml
      - scripts/baseline_durations.py
      - scripts/pytest_cost_probe.py

jobs:
  measure:
    runs-on: ubuntu-latest
    # Same services, same versions, same environment as the `pytest` job in
    # tests.yml. A measurement of a different suite than CI runs is worthless.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mftik
          POSTGRES_PASSWORD: mftik
          POSTGRES_DB: mftik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mftik -d mftik_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://mftik:mftik@localhost:5432/mftik_test
      DATABASE_URL_SYNC: postgresql+psycopg://mftik:mftik@localhost:5432/mftik_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            nats:2.11-alpine -m 8222
          for _ in $(seq 30); do
            if curl -sf http://localhost:8222/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::nats-server did not come up" >&2
          docker logs nats >&2 || true
          exit 1

      - name: Sync
        run: uv sync --all-packages

      - name: Runner facts
        run: |
          nproc
          free -m
          uv run --all-packages python -c "import sys; print(sys.version)"

      # The authoritative numbers: byte for byte the `Test` step of tests.yml,
      # plus the two reporting flags. Nothing is wrapped, so the module table
      # in appendix C is of the suite as it runs today.
      - name: Measure
        run: |
          start=$(date +%s)
          set +e
          uv run --all-packages pytest packages apps -q \
            --durations=0 --junitxml=junit.xml -o junit_family=xunit1 \
            | tee durations.txt
          echo "pytest exit: ${PIPESTATUS[0]}"
          set -e
          echo "wall=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Connections the suite opened
        run: |
          curl -s http://localhost:8222/varz \
            | python3 -c "import json,sys; v=json.load(sys.stdin); print('total_connections', v['total_connections']); print('in_msgs', v['in_msgs']); print('out_msgs', v['out_msgs'])"

      # Second pass, wrapped, for the cause of each test's time. Separate run
      # because the wrapping costs something and the table above must not pay
      # for it.
      - name: Measure what the time went on
        run: |
          start=$(date +%s)
          set +e
          PYTHONPATH=scripts uv run --all-packages pytest packages apps -q \
            -p pytest_cost_probe --cost-probe-out=probe.json \
            --junitxml=junit-probe.xml -o junit_family=xunit1
          echo "pytest exit: $?"
          set -e
          echo "probe_wall=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Aggregate
        run: |
          uv run --all-packages python scripts/baseline_durations.py \
            --junit junit.xml --probe probe.json --probe-junit junit-probe.xml \
            --wall "$wall" --probe-wall "$probe_wall" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-durations
          path: |
            report.md
            junit.xml
            junit-probe.xml
            probe.json
            durations.txt

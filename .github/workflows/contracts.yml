name: Contracts

on:
  push:
    paths:
      - "apps/**"
      - "contracts/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "apps/**"
      - "contracts/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/contracts.yml"

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages
      - name: Verify OpenAPI contract is clean
        run: |
          uv run --all-packages python -c "import json; from mft_api.main import app; print(json.dumps(app.openapi(), indent=2))" > /tmp/openapi.json
          diff -u contracts/openapi.json /tmp/openapi.json

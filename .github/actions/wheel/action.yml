name: wheel
description: Build one abi3 wheel with maturin and smoke it in a clean venv.

inputs:
  target:
    description: maturin-action target, x86_64 or aarch64
    required: true
  manylinux:
    description: manylinux tag for the Linux build. Empty on macOS.
    required: false
    default: ""
  platform:
    description: manylinux_2_28_x86_64 or macos_arm64
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.11"

    - name: Version sources agree
      shell: bash
      run: scripts/release-check versions

    - name: Runner matches the wheel
      shell: bash
      env:
        WHEEL_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        command -v python3.11
        arch="$(uname -m)"
        case "$WHEEL_PLATFORM" in
          manylinux_2_28_x86_64) test "$arch" = x86_64 ;;
          macos_arm64) test "$arch" = arm64 ;;
          *) echo "unknown platform $WHEEL_PLATFORM" >&2; exit 1 ;;
        esac

    - name: Clean dist
      shell: bash
      run: rm -rf dist && mkdir dist

    # maturin build does not pass --sdist. The next step rejects one anyway.
    - name: Build the wheel
      uses: PyO3/maturin-action@v1.51.0
      with:
        target: ${{ inputs.target }}
        manylinux: ${{ inputs.manylinux }}
        maturin-version: "1.15.0"
        args: --release --out dist --interpreter python3.11
        before-script-linux: |
          command -v python3.11
          python3.11 --version

    - name: Smoke the wheel in a clean venv
      shell: bash
      env:
        WHEEL_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=(dist/*.whl)
        sdists=(dist/*.tar.gz dist/*.zip)
        if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 0 )); then
          echo "expected one wheel and no sdist" >&2
          ls -la dist >&2 || true
          exit 1
        fi
        scripts/release-check wheel "${wheels[0]}" --platform "$WHEEL_PLATFORM" --python python3.11

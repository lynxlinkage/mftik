[project]
name = "mft-common"
version = "0.1.0"
description = "Shared MFT business logic (protocol, broker, runtime, exchange)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "redis>=5.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft"]

[tool.hatch.build.targets.wheel.sources]
"src/mft" = "mft"

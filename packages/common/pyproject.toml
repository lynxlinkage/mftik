[project]
name = "mftik-common"
version = "0.1.0"
description = "Shared MFT business logic (protocol, broker, runtime, exchange)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "redis>=5.0",
    "pyyaml>=6.0",
    "websockets>=14.0",
    "httpx>=0.27",
    # Ed25519, for Binance's WebSocket API session logon. Gate signs with
    # HMAC out of hashlib; Binance accepts nothing but Ed25519 there.
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik" = "mftik"

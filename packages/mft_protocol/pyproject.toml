[project]
name = "mft-protocol"
version = "0.1.0"
description = "MFT self-defined message protocol"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_protocol"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_protocol" = "mft_protocol"

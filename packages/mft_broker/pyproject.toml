[project]
name = "mft-broker"
version = "0.1.0"
description = "MFT Redis broker client (P2P Streams + Pub/Sub)"
requires-python = ">=3.12"
dependencies = [
    "mft-protocol",
    "redis>=5.0",
]

[tool.uv.sources]
mft-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_broker"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_broker" = "mft_broker"

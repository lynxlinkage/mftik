[project]
name = "mft-db"
version = "0.1.0"
description = "MFT SQLAlchemy models, repositories, session, and Alembic migrations"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[project.scripts]
mft-db-migrate = "mft_db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mft_db"]

[tool.hatch.build.targets.wheel.sources]
"src/mft_db" = "mft_db"

[tool.hatch.build.targets.wheel.force-include]
"src/mft_db/migrations/script.py.mako" = "mft_db/migrations/script.py.mako"

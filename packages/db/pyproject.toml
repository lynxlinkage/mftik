[project]
name = "mftik-db"
version = "0.1.0"
description = "MFTIK SQLAlchemy models, repositories, session, and Alembic migrations"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[project.scripts]
mftik-db-migrate = "mftik_db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mftik_db"]

[tool.hatch.build.targets.wheel.sources]
"src/mftik_db" = "mftik_db"

[tool.hatch.build.targets.wheel.force-include]
"src/mftik_db/migrations/script.py.mako" = "mftik_db/migrations/script.py.mako"

[project]
name = "mft-workspace"
version = "0.1.0"
description = "MFT monorepo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
src = ["apps", "packages"]
exclude = ["**/migrations/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP046"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
pythonpath = ["packages/common/src", "packages/db/src"]

[project]
name = "mftik"
version = "1.1.0"
description = "STS Python SDK compatible with mftiko (PROTOCOL §9)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.8,<2",
    "mypy>=2.4.0",
    "ruff>=0.17",
]

[tool.maturin]
manifest-path = "crates/mftik-py/Cargo.toml"
module-name = "mftik._mftik"
python-source = "python"
bindings = "pyo3"
# build.rs writes these after the proto descriptor changes. They are gitignored
# (E01-D005) and still have to ship in the wheel.
include = [
    "python/mftik/common/**/*.pyi",
    "python/mftik/md/**/*.pyi",
    "python/mftik/td/**/*.pyi",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

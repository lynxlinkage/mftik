[project]
name = "mftik-workspace"
version = "0.1.0"
description = "MFTIK monorepo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    # `conftest.py` implements `pytest_asyncio_loop_factories`, and that hookspec
    # is 1.4's. Below it pytest-asyncio does not know the name, pytest rejects
    # the plugin outright — `PluginValidationError: unknown hook` — and no test
    # in the workspace runs. 1.4 pins `pytest>=8.4` itself; the floor is named
    # here too because the same 8.4 is what gives `pytest.HIDDEN_PARAM`, which
    # is why one loop factory leaves test ids alone.
    "pytest>=8.4",
    "pytest-asyncio>=1.4",
    "ruff>=0.9",
    "aiosqlite>=0.20",
    "fakeredis>=2.23",
]

[tool.ruff]
target-version = "py312"
src = ["apps", "packages"]
exclude = ["**/migrations/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
# Tier markers are B2-04's. Registered here so the sleep guard (B2-02) can
# tell unit/component, which forbid wall-clock asyncio.sleep, from
# integration/e2e, which allow it. ``real_sleep`` is the narrow opt-out.
# ``integration`` keeps IF-03's wording: real subprocesses sit outside the
# unit budget once tiers land (§9.1).
markers = [
    "component: component tier (B2-04). Wall-clock asyncio.sleep is forbidden, same as an unmarked unit test.",
    "integration: real subprocesses; outside the unit budget once tiers land (§9.1). Wall-clock asyncio.sleep is allowed.",
    "e2e: e2e tier (B2-04). Wall-clock asyncio.sleep is allowed.",
    "real_sleep(reason): opt a unit or component test out of the asyncio.sleep(x > 0) ban. reason is a non-empty string.",
]
pythonpath = [
    # The venue stand-in servers (`gate_stub`, `binance_stub`) live beside the
    # adapter tests that drive them hardest, but the apps composing those
    # adapters need them too — MD's reader talks to the same fake Binance.
    # One copy, importable from either side, beats two that drift.
    "packages/common/tests",
    "packages/common/src",
    # `db_harness` stands up the database every DB-touching test runs against,
    # and those live in five packages — same reasoning as the stubs above.
    "packages/db/tests",
    "packages/db/src",
    "apps/td/src",
    "apps/api/src",
    "apps/md/src",
    "apps/sts/src",
    "apps/sym/src",
    "apps/paper/src",
]

[project]
name = "mft-workspace"
version = "0.1.0"
description = "MFT monorepo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "fakeredis>=2.26",
    "aiosqlite>=0.20",
]

[tool.ruff]
target-version = "py312"
src = ["apps", "packages"]
exclude = ["**/migrations/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
pythonpath = [
    # The venue stand-in servers (`gate_stub`, `binance_stub`) live beside the
    # adapter tests that drive them hardest, but the apps composing those
    # adapters need them too — MD's reader talks to the same fake Binance.
    # One copy, importable from either side, beats two that drift.
    "packages/common/tests",
    "packages/common/src",
    "packages/db/src",
    "apps/td/src",
    "apps/api/src",
    "apps/md/src",
    "apps/sts/src",
    "apps/sym/src",
    "apps/paper/src",
]
